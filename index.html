<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ป่าตะเกียง</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1b21;--moss:#2f6b4f;--lamp:#ffc857;--coral:#ff6b6b;--mist:#e6f2ea;--pad:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;font-family:'Kanit',system-ui,sans-serif;color:var(--mist)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#score{font-size:34px;font-weight:600;color:var(--lamp);line-height:1;text-shadow:0 2px 0 #0008}
#score small{display:block;font-size:13px;font-weight:400;color:var(--mist);opacity:.8}
#hearts{font-size:24px;letter-spacing:3px;text-shadow:0 2px 0 #0008}
#stam{position:fixed;left:16px;right:16px;top:calc(66px + env(safe-area-inset-top,0px));height:8px;border-radius:6px;background:#0007;overflow:hidden;pointer-events:none}
#stam i{display:block;height:100%;width:100%;background:var(--lamp);border-radius:6px;transition:background .15s}
#stam.low i{background:var(--coral)}
#joy{position:fixed;left:0;top:0;bottom:0;width:55%}
#base,#knob{position:fixed;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .15s}
#base{width:120px;height:120px;border:3px solid #e6f2ea66;background:#e6f2ea14}
#knob{width:54px;height:54px;background:#ffc857d9;box-shadow:0 0 18px #ffc85799}
#run{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));width:92px;height:92px;border-radius:50%;border:3px solid var(--lamp);background:#ffc8571f;color:var(--lamp);font:600 20px 'Kanit',sans-serif;display:flex;align-items:center;justify-content:center;transition:transform .08s,background .08s}
#run.on{transform:scale(.92);background:var(--lamp);color:var(--ink);box-shadow:0 0 28px #ffc857aa}
#throw{position:fixed;right:calc(128px + env(safe-area-inset-right,0px));bottom:calc(58px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;border:3px solid var(--coral);background:#ff6b6b1f;color:var(--coral);font:600 18px 'Kanit',sans-serif;display:flex;align-items:center;justify-content:center;transition:transform .08s,background .08s}
#throw:active{transform:scale(.92);background:var(--coral);color:var(--ink)}
#throw.wait{opacity:.35}
#score{pointer-events:auto}
#lv{text-align:right;font-size:15px;font-weight:600;margin-top:2px}
#xpb{position:fixed;left:16px;right:16px;top:calc(78px + env(safe-area-inset-top,0px));height:5px;border-radius:5px;background:#0007;overflow:hidden;pointer-events:none}
#xpb i{display:block;height:100%;width:0;background:#7fd6ff;border-radius:5px;transition:width .2s}
#atk{position:fixed;right:calc(30px + env(safe-area-inset-right,0px));bottom:calc(144px + env(safe-area-inset-bottom,0px));width:80px;height:80px;border-radius:50%;border:3px solid #fff3c4;background:#fff3c41f;color:#fff3c4;font:600 18px 'Kanit',sans-serif;display:flex;align-items:center;justify-content:center;transition:transform .08s,background .08s}
#atk:active{transform:scale(.92);background:#fff3c4;color:var(--ink)}
#toast{position:fixed;left:0;right:0;top:calc(120px + env(safe-area-inset-top,0px));text-align:center;font-size:26px;font-weight:600;color:var(--lamp);text-shadow:0 2px 0 #000a;pointer-events:none;opacity:0;transition:opacity .3s}
#swp{position:fixed;right:calc(120px + env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:2px solid #7fd6ff;background:#7fd6ff1f;color:#7fd6ff;font:600 22px 'Kanit',sans-serif;display:none;align-items:center;justify-content:center}
#swp:active{background:#7fd6ff;color:var(--ink)}
#pbtn{position:fixed;left:16px;top:calc(130px + env(safe-area-inset-top,0px));font-size:22px;padding:4px 10px;border-radius:10px;background:#0006}
#mw,.wal{font-size:15px;color:var(--lamp);background:#0006;padding:6px 14px;border-radius:20px}
.mrow{display:flex;gap:10px}
